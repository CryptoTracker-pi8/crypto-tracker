version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: crypto-tracker-db
    environment:
      POSTGRES_DB: cryptotracker_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: hackme
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crypto-tracker-backend
    environment:
      ENV: local
      POSTGRES_DB: cryptotracker_db
      POSTGRES_HOST: postgres
      POSTGRES_USER: user
      POSTGRES_PASSWORD: hackme
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn cryptotracker.__main__:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
